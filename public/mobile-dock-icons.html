<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Иконки mobile-dock · варианты</title>
<style>
  :root {
    --bg: #0b0d10;
    --card: #12161b;
    --text: #eceff3;
    --secondary: #b4bcc6;
    --muted: #8b939e;
    --border: rgba(255, 255, 255, 0.08);
    --picker: #0e1114;
  }
  [data-theme='light'] {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #0f172a;
    --secondary: #334155;
    --muted: #64748b;
    --border: rgba(15, 23, 42, 0.1);
    --picker: #ffffff;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: Inter, system-ui, sans-serif;
    background: #0b0d10;
    color: #e8eaed;
  }
  [data-theme='light'] body { background: #e8eaed; color: #0f172a; }
  button { font: inherit; color: inherit; cursor: pointer; }

  .picker {
    position: sticky; top: 0; z-index: 5;
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    padding: 14px 22px;
    background: var(--picker);
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  [data-theme='light'] .picker { border-bottom-color: rgba(15,23,42,.1); }
  .picker h1 { margin: 0; font-size: 14px; font-weight: 600; }
  .picker p { margin: 2px 0 0; font-size: 13px; color: #8b939c; max-width: 62ch; }
  .theme-toggle {
    margin-left: auto;
    border: 1px solid rgba(255,255,255,.08);
    background: #181c21; color: #e8eaed;
    border-radius: 9px; padding: 8px 12px; font-size: 13px;
  }
  [data-theme='light'] .theme-toggle {
    background: #fff; color: #0f172a; border-color: rgba(15,23,42,.12);
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 28px;
    padding: 28px 22px 48px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .card h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .card p { margin: 4px 0 12px; font-size: 13px; line-height: 1.45; color: #8b939c; max-width: 38ch; }

  .phone {
    position: relative;
    width: 100%; max-width: 360px;
    aspect-ratio: 9 / 15;
    margin: 0 auto;
    border-radius: 36px;
    border: 1px solid rgba(255,255,255,.12);
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
  }
  [data-theme='light'] .phone {
    border-color: rgba(15,23,42,.14);
    box-shadow: 0 18px 40px rgba(15,23,42,.1);
  }
  .phone__notch {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 96px; height: 22px; border-radius: 999px; background: #0a0c0f; z-index: 3;
  }
  [data-theme='light'] .phone__notch { background: #cbd5e1; }

  .screen { height: 100%; padding: 44px 16px 88px; }
  .screen__title { font-size: 20px; font-weight: 600; letter-spacing: -.03em; margin-bottom: 12px; }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 14px;
    color: var(--secondary);
    font-size: 13px;
    line-height: 1.4;
  }

  .dock {
    position: absolute;
    left: 12px; right: 12px; bottom: 14px;
    display: flex; align-items: center; gap: 4px;
    height: 56px; padding: 4px 6px;
    border-radius: 18px;
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: 0 12px 32px rgba(0,0,0,.35);
  }
  [data-theme='light'] .dock { box-shadow: 0 10px 24px rgba(15,23,42,.08); }

  .dock__logo {
    width: 22px; height: 22px; margin: 0 8px; flex: 0 0 auto;
    filter: brightness(0) invert(1); opacity: .4;
  }
  [data-theme='light'] .dock__logo { filter: brightness(0); }
  .dock__avatar {
    width: 44px; height: 44px; flex: 0 0 auto;
    border: 0; background: transparent;
    color: var(--secondary); font-size: 11px; font-weight: 600;
    border-radius: 12px;
  }

  .tabs {
    flex: 1; min-width: 0; height: 100%;
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .tab {
    position: relative;
    min-width: 0; height: 100%;
    border: 0; background: transparent;
    color: var(--secondary);
    display: flex; align-items: center; justify-content: center;
    padding: 0 2px;
  }
  .tab.is-on { color: var(--text); }
  .tab svg { width: 20px; height: 20px; display: block; }
  .tab span {
    position: absolute; left: 1px; right: 1px;
    top: calc(50% + 12px);
    font-size: 10px; font-weight: 600; line-height: 1;
    text-align: center;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    opacity: 0; pointer-events: none;
  }
  .tab.is-on span { opacity: 1; }

  .strip {
    display: flex; gap: 18px; align-items: center; justify-content: center;
    margin-top: 10px; padding: 10px 12px;
    border-radius: 12px; background: var(--card); border: 1px solid var(--border);
    color: var(--text);
  }
  .strip figure {
    margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px;
    min-width: 56px;
  }
  .strip svg { width: 22px; height: 22px; }
  .strip figcaption { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
  <header class="picker">
    <div>
      <h1>Варианты иконок</h1>
      <p>Капсула как сейчас (подпись только у активного). Тап по табу переключает. Напиши букву набора — перенесу в приложение.</p>
    </div>
    <button type="button" class="theme-toggle" id="themeToggle">Тема</button>
  </header>

  <div class="gallery" id="gallery"></div>

<script>
const ICONS = {

  },
  B: {

    portfolio: `<svg viewBox="0 0 24 24" fill="none"><path d="M4 19h16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M6 16V11M11 16V7M16 16v-5M19 16V9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`,
    robots: `<svg viewBox="0 0 24 24" fill="none"><rect x="7" y="7" width="10" height="10" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M12 4v3M12 17v3M4 12h3M17 12h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M10 10h4v4h-4z" stroke="currentColor" stroke-width="1.5"/></svg>`,
    lab: `<svg viewBox="0 0 24 24" fill="none"><path d="M8 3h8M9.5 3v6.2L5.8 16.2A2.3 2.3 0 0 0 7.8 20h8.4a2.3 2.3 0 0 0 2-3.8l-3.7-6.8V3" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 14.5c1.2 1 2.6 1.5 4 1.5s2.8-.5 4-1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`,
  },
  D: {
    title: 'D. Wallet / Bot / Flask filled accents',
    blurb: 'Чуть плотнее: мелкие заливки для акцентов, лучше читаются в 20px.',
    portfolio: `<svg viewBox="0 0 24 24" fill="none"><path d="M3.5 8.5h17v10a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2v-10Z" stroke="currentColor" stroke-width="1.5"/><path d="M3.5 8.5 5.2 5.8A2 2 0 0 1 6.9 5h10.2a2 2 0 0 1 1.7.8l1.7 2.7" stroke="currentColor" stroke-width="1.5"/><circle cx="16.5" cy="13.5" r="1.4" fill="currentColor"/></svg>`,
    robots: `<svg viewBox="0 0 24 24" fill="none"><rect x="5" y="7" width="14" height="12" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M12 3.5v3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="12" cy="3.2" r="1.1" fill="currentColor"/><circle cx="9" cy="12" r="1.4" fill="currentColor"/><circle cx="15" cy="12" r="1.4" fill="currentColor"/><path d="M9 16.2h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`,
    lab: `<svg viewBox="0 0 24 24" fill="none"><path d="M9 2.5h6M10 2.5v5L5.5 16a2.5 2.5 0 0 0 2.2 3.8h8.6A2.5 2.5 0 0 0 18.5 16L14 7.5v-5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M7.2 15h9.6" stroke="currentColor" stroke-width="1.5"/><path d="M7.2 15c.8 2.2 2.6 3.3 4.8 3.3s4-1.1 4.8-3.3" fill="currentColor" opacity=".22"/></svg>`,
  },
  E: {
    title: 'E. Pie / Hex / Drop',
    blurb: 'Другая метафора: доля портфеля, гекс-агент, капля эксперимента.',
    portfolio: `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.25" stroke="currentColor" stroke-width="1.5"/><path d="M12 12V3.75A8.25 8.25 0 0 1 19.4 15.3L12 12Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>`,
    robots: `<svg viewBox="0 0 24 24" fill="none"><path d="M12 3.5 19 7.5v9L12 20.5 5 16.5v-9L12 3.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.2" stroke="currentColor" stroke-width="1.5"/></svg>`,
    lab: `<svg viewBox="0 0 24 24" fill="none"><path d="M12 3c0 0 6 6.2 6 11a6 6 0 1 1-12 0C6 9.2 12 3 12 3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8.2 14.5h7.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`,
  },
  F: {
    title: 'F. Rounded duotone',
    blurb: 'Мягкие формы + лёгкая заливка 18%. Ближе к «product icon».',
    portfolio: `<svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="8" width="17" height="11.5" rx="3" stroke="currentColor" stroke-width="1.5"/><rect x="3.5" y="8" width="17" height="11.5" rx="3" fill="currentColor" opacity=".14"/><path d="M8 8V6.8A2.8 2.8 0 0 1 10.8 4h2.4A2.8 2.8 0 0 1 16 6.8V8" stroke="currentColor" stroke-width="1.5"/></svg>`,
    robots: `<svg viewBox="0 0 24 24" fill="none"><rect x="5.5" y="7" width="13" height="12" rx="4" stroke="currentColor" stroke-width="1.5"/><rect x="5.5" y="7" width="13" height="12" rx="4" fill="currentColor" opacity=".14"/><path d="M12 3.5v3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="9.5" cy="12.2" r="1.2" fill="currentColor"/><circle cx="14.5" cy="12.2" r="1.2" fill="currentColor"/></svg>`,
    lab: `<svg viewBox="0 0 24 24" fill="none"><path d="M9 3h6M10 3v5.5L6 16.2A2.4 2.4 0 0 0 8.1 20h7.8A2.4 2.4 0 0 0 18 16.2L14 8.5V3" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M7.4 14.8h9.2C16 17 14.3 18.2 12 18.2S8 17 7.4 14.8Z" fill="currentColor" opacity=".18"/></svg>`,
  },
  G: {
    title: 'G. Stack / Pulse / Crosshair',
    blurb: 'Портфель как слои, роботы как сигнал, лаб как прицел теста.',
    portfolio: `<svg viewBox="0 0 24 24" fill="none"><path d="M4 15.5 12 19l8-3.5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M4 11.5 12 15l8-3.5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M4 7.5 12 11l8-3.5L12 4 4 7.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>`,
    robots: `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="2.1" fill="currentColor"/><path d="M12 5.5v2.2M12 16.3v2.2M5.5 12h2.2M16.3 12h2.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M7.4 7.4l1.6 1.6M15 15l1.6 1.6M16.6 7.4 15 9M9 15l-1.6 1.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".55"/></svg>`,
    lab: `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="7.5" stroke="currentColor" stroke-width="1.5"/><path d="M12 7v10M7 12h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="12" cy="12" r="2" stroke="currentColor" stroke-width="1.5"/></svg>`,
  },
}

const labels = { portfolio: 'Портфель', robots: 'Роботы', lab: 'Лаб' }
const gallery = document.getElementById('gallery')

for (const [key, set] of Object.entries(ICONS)) {
  const art = document.createElement('article')
  art.className = 'card'
  art.innerHTML = `
    <h2>${set.title}</h2>
    <p>${set.blurb}</p>
    <div class="strip" aria-hidden="true">
      <figure>${set.portfolio}<figcaption>Портфель</figcaption></figure>
      <figure>${set.robots}<figcaption>Роботы</figcaption></figure>
      <figure>${set.lab}<figcaption>Лаб</figcaption></figure>
    </div>
    <div class="phone" data-set="${key}" style="margin-top:12px">
      <div class="phone__notch"></div>
      <div class="screen">
        <div class="screen__title">Портфель</div>
        <div class="panel">Набор ${key}. Активный таб с подписью.</div>
      </div>
      <nav class="dock">
        <img class="dock__logo" src="/favicon.svg" alt="" />
        <div class="tabs">
          <button type="button" class="tab is-on" data-tab data-title="Портфель">${set.portfolio}<span>${labels.portfolio}</span></button>
          <button type="button" class="tab" data-tab data-title="Роботы">${set.robots}<span>${labels.robots}</span></button>
          <button type="button" class="tab" data-tab data-title="Лаб">${set.lab}<span>${labels.lab}</span></button>
        </div>
        <button type="button" class="dock__avatar">GY</button>
      </nav>
    </div>
  `
  gallery.appendChild(art)
}

document.getElementById('themeToggle').addEventListener('click', () => {
  const root = document.documentElement
  if (root.getAttribute('data-theme') === 'light') root.removeAttribute('data-theme')
  else root.setAttribute('data-theme', 'light')
})

document.querySelectorAll('.phone').forEach(phone => {
  phone.querySelectorAll('[data-tab]').forEach(tab => {
    tab.addEventListener('click', () => {
      phone.querySelectorAll('[data-tab]').forEach(t => t.classList.remove('is-on'))
      tab.classList.add('is-on')
      const title = phone.querySelector('.screen__title')
      if (title) title.textContent = tab.dataset.title
    })
  })
})
</script>
</body>
</html>
