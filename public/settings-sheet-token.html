<!DOCTYPE html>
<html lang="ru" data-theme="dark" data-v="a">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>settings-sheet-seg-token · варианты · GIN</title>
<style>
  :root {
    --bg-page: #0a0a0f;
    --bg-card: #12121a;
    --bg-input: #0e0e16;
    --bg-elevated: #181824;
    --border-subtle: rgba(255, 255, 255, 0.06);
    --border-medium: rgba(255, 255, 255, 0.12);
    --text-primary: #e0e0e0;
    --text-secondary: #888888;
    --text-muted: #555555;
    --color-up: #00ffaa;
    --color-down: #ff3366;
    --color-warn: #ffaa00;
    --radius-lg: 12px;
    --picker-bg: #0e0e14;
    --phone-w: 390px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: Inter, system-ui, -apple-system, sans-serif;
    background: #07070b;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  button:focus-visible { outline: 2px solid rgba(255,255,255,0.28); outline-offset: 2px; }

  .picker {
    position: sticky; top: 0; z-index: 40;
    display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px 20px;
    padding: 14px 20px;
    background: var(--picker-bg);
    border-bottom: 1px solid var(--border-subtle);
  }
  .picker h1 { margin: 0; font-size: 14px; font-weight: 600; }
  .picker p { margin: 4px 0 0; max-width: 72ch; font-size: 13px; color: var(--text-secondary); line-height: 1.45; }
  .picker__modes {
    display: flex; flex-wrap: wrap; gap: 4px; padding: 4px;
    margin-left: auto; background: var(--bg-input); border-radius: 12px;
  }
  .picker__modes button {
    border: 1px solid transparent; border-radius: 9px;
    padding: 8px 12px; min-height: 36px;
    font-size: 13px; font-weight: 500; color: var(--text-muted);
  }
  .picker__modes button.is-on {
    background: var(--bg-elevated); color: var(--text-primary);
    border-color: var(--border-medium);
  }
  .picker__note {
    flex: 1 1 100%;
    margin: 0; font-size: 12.5px; color: var(--text-muted); line-height: 1.4;
  }
  .picker__note strong { color: var(--text-secondary); }

  .stage {
    display: flex; justify-content: center;
    padding: 28px 16px 48px; min-height: calc(100vh - 100px);
  }
  .phone {
    width: var(--phone-w); max-width: 100%;
    border-radius: 28px;
    border: 1px solid var(--border-medium);
    background: var(--bg-page);
    box-shadow: 0 24px 64px rgba(0,0,0,0.55);
    overflow: hidden;
  }
  .phone__pad { padding: 14px 12px 24px; }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }

  .broker-h {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; min-height: 52px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .broker-h__icon {
    width: 28px; height: 28px; border-radius: 8px;
    display: grid; place-items: center;
    background: var(--bg-input); border: 1px solid var(--border-subtle);
    font-size: 10px; font-weight: 700; color: var(--text-secondary);
  }
  .broker-h__name { font-size: 14.5px; font-weight: 600; }

  .seg {
    display: grid; grid-template-columns: 1fr 1fr; gap: 3px;
    margin: 10px 12px 0; padding: 3px; border-radius: 10px; background: var(--bg-input);
  }
  .seg button {
    min-height: 34px; border-radius: 8px; font-size: 13px; font-weight: 500;
    color: var(--text-muted);
  }
  .seg button.is-on { background: var(--bg-elevated); color: var(--text-primary); }
  .seg__count { margin-left: 4px; font-weight: 600; opacity: 0.7; }

  .cap-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px 6px;
  }
  .cap { font-size: 12px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.02em; }
  .add {
    width: 28px; height: 28px; display: grid; place-items: center;
    border-radius: 8px; color: var(--text-muted); font-size: 16px; line-height: 1;
  }

  .variant { display: none; }
  body[data-v='a'] .variant-a,
  body[data-v='b'] .variant-b,
  body[data-v='c'] .variant-c,
  body[data-v='d'] .variant-d,
  body[data-v='e'] .variant-e { display: block; }

  /* shared token bits */
  .name { font-size: 14px; font-weight: 400; line-height: 1.25; color: var(--text-primary); }
  .meta { font-size: 12px; line-height: 1.35; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .pill {
    flex-shrink: 0; padding: 3px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 600;
    background: color-mix(in srgb, var(--color-up) 14%, transparent);
    color: var(--color-up);
  }
  .pill.is-warn {
    background: color-mix(in srgb, var(--color-warn) 14%, transparent);
    color: var(--color-warn);
  }
  .pill.is-err {
    background: color-mix(in srgb, var(--color-down) 14%, transparent);
    color: var(--color-down);
  }
  .del {
    flex-shrink: 0; width: 44px; height: 44px; display: grid; place-items: center;
    border-radius: 10px; color: color-mix(in srgb, var(--color-down) 80%, var(--text-secondary));
    font-size: 14px;
  }
  .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 999px;
    background: var(--color-up); flex-shrink: 0;
  }
  .dot.is-warn { background: var(--color-warn); }
  .dot.is-err { background: var(--color-down); }
  .chev { color: var(--text-muted); font-size: 11px; flex-shrink: 0; }

  /* A · current */
  .a-row {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; min-height: 52px;
    border-top: 1px solid var(--border-subtle);
  }
  .variant-a .list > :first-child .a-row { border-top: 0; }
  .a-main { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; text-align: left; }

  /* B · status dot, no pill */
  .b-row {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; min-height: 52px;
    border-top: 1px solid var(--border-subtle);
  }
  .variant-b .list > :first-child .b-row { border-top: 0; }
  .b-main {
    min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; text-align: left;
  }
  .b-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .b-title .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* C · trailing status text */
  .c-row {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px; min-height: 52px;
    border-top: 1px solid var(--border-subtle);
  }
  .variant-c .list > :first-child .c-row { border-top: 0; }
  .c-main { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; text-align: left; }
  .c-status {
    flex-shrink: 0; font-size: 12px; font-weight: 500; color: var(--color-up);
    text-align: right;
  }
  .c-status.is-warn { color: var(--color-warn); }
  .c-status.is-err { color: var(--color-down); }
  .c-more {
    width: 36px; height: 36px; display: grid; place-items: center;
    border-radius: 10px; color: var(--text-muted); font-size: 18px; letter-spacing: 1px;
  }

  /* D · inset cards */
  .d-list { display: flex; flex-direction: column; gap: 8px; padding: 4px 12px 14px; }
  .d-card {
    display: flex; align-items: center; gap: 10px;
    padding: 12px; min-height: 56px;
    border-radius: 12px;
    background: var(--bg-input);
    border: 1px solid var(--border-subtle);
  }
  .d-main { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; text-align: left; }
  .d-rail {
    display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0;
  }
  .d-del {
    width: 32px; height: 28px; display: grid; place-items: center;
    border-radius: 8px; color: var(--text-muted); font-size: 12px;
  }

  /* E · key glyph + chevron disclosure */
  .e-row {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; min-height: 56px;
    border-top: 1px solid var(--border-subtle);
  }
  .variant-e .list > :first-child .e-row { border-top: 0; }
  .e-glyph {
    width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
    display: grid; place-items: center;
    background: var(--bg-input); border: 1px solid var(--border-subtle);
    color: var(--text-secondary); font-size: 13px;
  }
  .e-main { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; text-align: left; }
  .e-meta-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .e-meta-row .meta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>

  <script>
    const notes = {
      a: '<strong>A · Now</strong> — текущий: имя + meta, pill OK/Warn/Err, trash справа.',
      b: '<strong>B · Dot</strong> — статус точкой у имени, без pill и без masked-токена; в meta только «когда использовали».',
      c: '<strong>C · Trailing</strong> — статус текстом справа, действия за «···» (удаление не на первом плане).',
      d: '<strong>D · Cards</strong> — отдельные inset-ячейки с фоном вместо списка с разделителями.',
      e: '<strong>E · Key</strong> — глиф ключа слева, статус-dot в meta, раскрытие шевроном; delete внутри details.',
    };
    const noteEl = document.getElementById('note');
    const buttons = [...document.querySelectorAll('.picker__modes button')];
    function setV(v) {
      document.body.dataset.v = v;
      buttons.forEach((b) => b.classList.toggle('is-on', b.dataset.v === v));
      noteEl.innerHTML = notes[v];
      history.replaceState(null, '', '#' + v);
    }
    buttons.forEach((b) => b.addEventListener('click', () => setV(b.dataset.v)));
    const fromHash = (location.hash || '#a').slice(1);
    if (notes[fromHash]) setV(fromHash);
  </script>
