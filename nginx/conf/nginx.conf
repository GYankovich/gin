worker_processes  1;

error_log  logs/error.log;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50m;

    access_log  logs/access.log;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Canonical site URL (no port). Alternate :8443 still served for fallback.
    map $server_port $canonical_https {
        8443    https://$host:8443$request_uri;
        default https://$host$request_uri;
    }

    upstream gin_api {
        server 127.0.0.1:8000;
    }

    upstream gin_ws {
        server 127.0.0.1:8001;
    }

    # --- HTTP :80 / :8080 → HTTPS without port (or :8443 fallback path via Keenetic) ---
    server {
        listen 80;
        listen 8080;
        server_name nefor.online www.nefor.online;

        location ^~ /.well-known/acme-challenge/ {
            root html;
            default_type text/plain;
        }

        location / {
            return 301 https://nefor.online$request_uri;
        }
    }

    # --- HTTPS :443 (canonical) + :8443 (fallback if ISP blocks 443) ---
    server {
        listen 443 ssl;
        listen 8443 ssl;
        server_name nefor.online www.nefor.online;

        ssl_certificate     C:/Users/GY/WebstormProjects/gin/nefor.online-chain.pem;
        ssl_certificate_key C:/Users/GY/WebstormProjects/gin/nefor.online-key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Plain HTTP accidentally sent to TLS port
        error_page 497 $canonical_https;

        location /api/ {
            proxy_pass http://gin_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
        }

        location /ws/ {
            proxy_pass http://gin_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location = /health {
            proxy_pass http://gin_api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /docs {
            proxy_pass http://gin_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /openapi.json {
            proxy_pass http://gin_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        root C:/Users/GY/WebstormProjects/gin/dist;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
